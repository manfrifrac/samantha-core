<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="card-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f293d" />
      <stop offset="100%" stop-color="#111927" />
    </linearGradient>
    <linearGradient id="card-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1f3d" />
      <stop offset="100%" stop-color="#191127" />
    </linearGradient>
    <linearGradient id="card-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f3d2b" />
      <stop offset="100%" stop-color="#112719" />
    </linearGradient>
    <linearGradient id="card-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d331f" />
      <stop offset="100%" stop-color="#272111" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="700" rx="16" fill="url(#bg-grad)" stroke="#30363d" stroke-width="2"/>

  <!-- Header -->
  <text x="550" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#58a6ff" text-anchor="middle" letter-spacing="1">SAMANTHA CORE — DISTRIBUTED MULTI-AGENT ARCHITECTURE</text>
  <text x="550" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#8b949e" text-anchor="middle">Unix-Native Terminal Agents · Deterministic Filesystem Inboxes · 5-Tier Self-Healing</text>

  <!-- 1. Operator / Telegram Gateway Layer -->
  <g transform="translate(100, 120)" filter="url(#glow)">
    <rect width="900" height="90" rx="10" fill="url(#card-blue)" stroke="#388bfd" stroke-width="1.5"/>
    <text x="30" y="35" font-family="sans-serif" font-size="16" font-weight="bold" fill="#58a6ff">👤 OPERATOR / INTERACTION LAYER</text>
    <text x="30" y="65" font-family="sans-serif" font-size="13" fill="#c9d1d9">Unified Telegram Gateway (Multi-Topic per Agent/Studio) &amp; Interactive Local CLI</text>
    <rect x="710" y="25" width="160" height="40" rx="6" fill="#1f6feb" opacity="0.2" stroke="#58a6ff"/>
    <text x="790" y="50" font-family="monospace" font-size="12" fill="#58a6ff" text-anchor="middle">Port :8080 / Bot API</text>
  </g>

  <!-- Arrow down -->
  <path d="M 550 210 L 550 250" stroke="#58a6ff" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/>

  <!-- 2. Studio Coordinators Layer -->
  <g transform="translate(100, 250)" filter="url(#glow)">
    <rect width="900" height="110" rx="10" fill="url(#card-purple)" stroke="#a371f7" stroke-width="1.5"/>
    <text x="30" y="35" font-family="sans-serif" font-size="16" font-weight="bold" fill="#d2a8ff">🏢 STUDIO COORDINATORS (Persistent Tmux Sessions)</text>
    <text x="30" y="62" font-family="sans-serif" font-size="13" fill="#c9d1d9">Dedicated workspace isolation · Always-on autonomous governance · No hallucinations in state transfer</text>
    <text x="30" y="88" font-family="monospace" font-size="12" fill="#bc8cff">CLI: agy (Antigravity) | claude (Claude Code) | qwen</text>
    
    <rect x="680" y="35" width="190" height="45" rx="6" fill="#8957e5" opacity="0.2" stroke="#a371f7"/>
    <text x="775" y="62" font-family="monospace" font-size="12" fill="#d2a8ff" text-anchor="middle">tmux: &lt;studio&gt;:AGY-&lt;ID&gt;</text>
  </g>

  <!-- Split Arrows -->
  <path d="M 350 360 L 350 410" stroke="#f0883e" stroke-width="2"/>
  <path d="M 750 360 L 750 410" stroke="#3fb950" stroke-width="2"/>

  <!-- 3. Left Box: A2A Filesystem Messaging & Protocol DEV-110 -->
  <g transform="translate(100, 410)" filter="url(#glow)">
    <rect width="430" height="140" rx="10" fill="url(#card-gold)" stroke="#d29922" stroke-width="1.5"/>
    <text x="25" y="30" font-family="sans-serif" font-size="15" font-weight="bold" fill="#e3b341">📨 DETERMINISTIC A2A QUEUES</text>
    <text x="25" y="55" font-family="sans-serif" font-size="12" fill="#c9d1d9">• Zero context pollution (Filesystem queues)</text>
    <text x="25" y="75" font-family="monospace" font-size="11" fill="#e3b341">  a2a/&lt;agent&gt;/inbox/&lt;ts&gt;__&lt;from&gt;__&lt;id&gt;.md</text>
    <text x="25" y="98" font-family="sans-serif" font-size="12" fill="#c9d1d9">• Protocol DEV-110: Mandatory ACK verification</text>
    <text x="25" y="118" font-family="monospace" font-size="11" fill="#7ee787">  a2a_ack.py &lt;id&gt; ➔ moves to a2a/&lt;agent&gt;/read/</text>
  </g>

  <!-- 4. Right Box: Ephemeral Task Executors (Execs) -->
  <g transform="translate(570, 410)" filter="url(#glow)">
    <rect width="430" height="140" rx="10" fill="url(#card-green)" stroke="#2ea043" stroke-width="1.5"/>
    <text x="25" y="30" font-family="sans-serif" font-size="15" font-weight="bold" fill="#7ee787">⚡ DISPOSABLE TASK EXECUTORS (Execs)</text>
    <text x="25" y="55" font-family="sans-serif" font-size="12" fill="#c9d1d9">• Spawned on-demand: <tspan font-family="monospace" fill="#58a6ff">crea_exec &lt;slug&gt;</tspan></text>
    <text x="25" y="75" font-family="sans-serif" font-size="12" fill="#c9d1d9">• Disk-based operational plan (<tspan font-family="monospace" fill="#58a6ff">piano_*.md</tspan>)</text>
    <text x="25" y="95" font-family="sans-serif" font-size="12" fill="#c9d1d9">• Delivers artifact + A2A completion report</text>
    <text x="25" y="118" font-family="sans-serif" font-size="12" fill="#ff7b72">• Immediate process reap &amp; GC: <tspan font-family="monospace" fill="#ff7b72">elimina_exec</tspan></text>
  </g>

  <!-- 5. Bottom Layer: 5-Tier Self-Healing & Model Cascades -->
  <g transform="translate(100, 580)" filter="url(#glow)">
    <rect width="900" height="85" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="25" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f0883e">🛡️ 5-TIER SELF-HEALING SUPERVISOR &amp; MODEL CASCADES</text>
    <text x="25" y="55" font-family="sans-serif" font-size="12" fill="#8b949e">Continuous heuristic watchdog (60s loop) · Auto-recovers stalled panes · Non-destructive process recycling</text>
    <text x="25" y="72" font-family="monospace" font-size="11" fill="#79c0ff">Dynamic 429 Quota Failover: Opus ➔ Sonnet ➔ Haiku | Pro ➔ Flash (Zero Session Loss)</text>
  </g>
</svg>
