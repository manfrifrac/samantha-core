<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d12" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Subtle Grid -->
  <g opacity="0.05" stroke="#fff" stroke-width="1">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
  </g>

  <!-- Content Container -->
  <g transform="translate(100, 140)">
    <!-- Badge -->
    <rect width="260" height="36" rx="18" fill="#1e293b" stroke="#334155"/>
    <text x="130" y="23" font-family="monospace" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">OPEN SOURCE AI FLEET</text>

    <!-- Main Title -->
    <text x="0" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="url(#title-grad)" letter-spacing="-1">SAMANTHA CORE</text>
    
    <!-- Subtitle -->
    <text x="0" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="500" fill="#e2e8f0">Autonomous AI Agent Fleet Infrastructure for 24/7 Production</text>

    <!-- Feature Pillars -->
    <g transform="translate(0, 210)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="240" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <text x="20" y="26" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">🖥️ Native Tmux</text>
      <text x="20" y="46" font-family="sans-serif" font-size="11" fill="#94a3b8">Interactive CLI harnesses</text>

      <!-- Pill 2 -->
      <rect x="260" y="0" width="240" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <text x="280" y="26" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">📨 DEV-110 A2A</text>
      <text x="280" y="46" font-family="sans-serif" font-size="11" fill="#94a3b8">Filesystem inbox queues</text>

      <!-- Pill 3 -->
      <rect x="520" y="0" width="240" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <text x="540" y="26" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">🛡️ 5-Tier Healing</text>
      <text x="540" y="46" font-family="sans-serif" font-size="11" fill="#94a3b8">Non-destructive watchdog</text>

      <!-- Pill 4 -->
      <rect x="780" y="0" width="260" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <text x="800" y="26" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">🧹 Ephemeral Execs</text>
      <text x="800" y="46" font-family="sans-serif" font-size="11" fill="#94a3b8">Automatic garbage collection</text>
    </g>

    <!-- Footer URL -->
    <text x="0" y="320" font-family="monospace" font-size="16" fill="#64748b">github.com/manfrifrac/samantha-core · Creator: Manfredo Fraccola</text>
  </g>
</svg>
